appId: com.dribsnis.app
name: Confirm actual dose independently of its plan
# Starts in the Home Log sheet with actual 105 mg at 21:14 on a past date.
# Pass QA_TAKEN and QA_PLANNED to match that occurrence's displayed date.
---
- scrollUntilVisible:
    element: "Injection site · Not recorded"
    direction: DOWN
- tapOn: "Injection site · Not recorded"
- scrollUntilVisible:
    element: "Right delt"
    direction: DOWN
- tapOn: "Right delt"
- scrollUntilVisible:
    element: "Injection site · Right delt"
    direction: DOWN
- assertVisible: "Injection site · Right delt"
- scrollUntilVisible:
    element: "Confirm dose"
    direction: DOWN
- tapOn: "Confirm dose"
- scrollUntilVisible:
    element: ${QA_TAKEN}
    direction: DOWN
- assertVisible: "105 mg · IM"
- assertVisible: ${QA_PLANNED}
- takeScreenshot: protocols-completed-actual-vs-plan
- scrollUntilVisible:
    element: "Open Protocols Today"
    direction: UP
- tapOn: "Open Protocols Today"
- tapOn: "Levels, tab, 2 of 4"
- scrollUntilVisible:
    element: "Previous chart point or event"
    direction: DOWN
- repeat:
    times: 100
    while:
      notVisible: "Recorded · 105 mg · IM"
    commands:
      - tapOn: "Previous chart point or event"
- assertVisible: "Recorded · 105 mg · IM"
- assertVisible: ".*21:14 · Europe/Vilnius"
- assertVisible: "Estimated amount · 0 mg"
- takeScreenshot: protocols-levels-actual-dose
